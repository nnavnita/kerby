name: CD Backend

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'migrations/**'
      - 'deploy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'rust-toolchain.toml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy -c deploy/fly.api.toml -a kerby-api --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
